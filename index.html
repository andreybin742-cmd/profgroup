<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профгруппа Дирекции связи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f0e8;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: #8b1e1e;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 24px; }
        .login-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .user-info {
            background: rgba(255,255,255,0.2);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logout-btn {
            background: rgba(0,0,0,0.3);
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            background: white;
            padding: 8px;
            border-radius: 50px;
        }
        .nav-tab {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            color: #666;
            cursor: pointer;
        }
        .nav-tab.active {
            background: #8b1e1e;
            color: white;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #8b1e1e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0e0d0;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .event-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            border-left: 4px solid #8b1e1e;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .event-date { color: #8b1e1e; font-size: 12px; font-weight: bold; }
        .event-title { font-size: 18px; font-weight: bold; margin: 8px 0; }

        .admin-panel {
            background: #fef0e0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-btn {
            background: #8b1e1e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .page { display: none; }
        .page.active { display: block; }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚂 Профгруппа Дирекции связи</h1>
        <div id="authSection">
            <button class="login-btn" id="showLoginBtn">🔐 Вход</button>
        </div>
    </div>

    <div class="nav-tabs" id="navTabs">
        <button class="nav-tab active" data-page="news">📰 Новости</button>
        <button class="nav-tab" data-page="events">🎉 Мероприятия</button>
        <button class="nav-tab" data-page="vouchers">🏖️ Путевки</button>
        <button class="nav-tab" data-page="admin" id="adminTab" style="display:none;">⚙️ Управление</button>
        <button class="nav-tab" data-page="group" id="groupTab" style="display:none;">👥 Группа</button>
    </div>

    <div id="newsPage" class="page active">
        <div id="newsList" class="events-grid"></div>
    </div>

    <div id="eventsPage" class="page">
        <div id="eventsList" class="events-grid"></div>
    </div>

    <div id="vouchersPage" class="page">
        <div id="vouchersList" class="events-grid"></div>
    </div>

    <div id="adminPage" class="page">
        <div class="card">
            <div class="card-title">🗳️ Голосования</div>
            <div id="pollsList"></div>
            <button class="admin-btn" onclick="openPollModal()">+ Создать голосование</button>
        </div>
        <div class="card">
            <div class="card-title">💰 Расходы</div>
            <div id="expensesList"></div>
            <button class="admin-btn" onclick="openExpenseModal()">+ Добавить расход</button>
        </div>
    </div>

    <div id="groupPage" class="page">
        <div class="card">
            <div class="card-title">👥 Члены профгруппы</div>
            <div id="groupList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
        <div class="card">
            <div class="card-title">🗳️ Голосования</div>
            <div id="groupPollsList"></div>
        </div>
    </div>

    <footer>© 2025 Профгруппа Дирекции связи | Роспрофжел</footer>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔐 Вход в профгруппу</h3>
            <button class="close-modal" onclick="closeLoginModal()">&times;</button>
        </div>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="loginUser" placeholder="Логин">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="loginPass" placeholder="Пароль">
        </div>
        <button class="admin-btn" style="width:100%" id="loginBtn">Войти</button>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModalOnClick(event)">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Добавить</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // Firebase настройки
    const firebaseConfig = {
        apiKey: "AIzaSyC68WrjVaCkf5kEGfoGkw1tx-ECsc42D1c",
        authDomain: "my-new-projekt2.firebaseapp.com",
        projectId: "my-new-projekt2",
        storageBucket: "my-new-projekt2.firebasestorage.app",
        messagingSenderId: "630983568534",
        appId: "1:630983568534:web:99d4a8a93126b9ab04e6b7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Данные для входа
    const USERS = {
        'НСЭ': '66',
        'ЦТУ': '10',
        'НСТ': '10',
        'НСАО': '11',
        'НСК': '40',
        'НСТ1': '26',
        'НСФЭ': '45',
        'НСДР': '13'
    };

    let currentUser = null;
    let isAdmin = false;

    // Загружаем публичные данные
    loadNews();
    loadEvents();
    loadVouchers();

    // Вход
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginModal').style.display = 'flex';
    };

    document.getElementById('loginBtn').onclick = () => {
        const login = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        
        if (USERS[login] && USERS[login] === pass) {
            currentUser = login;
            isAdmin = (login === 'НСЭ');
            
            // Меняем интерфейс
            document.getElementById('authSection').innerHTML = `
                <div class="user-info">
                    👤 ${currentUser} ${isAdmin ? '(Админ)' : ''}
                    <button class="logout-btn" onclick="logout()">Выйти</button>
                </div>
            `;
            
            // Показываем вкладки
            document.getElementById('groupTab').style.display = 'block';
            if (isAdmin) {
                document.getElementById('adminTab').style.display = 'block';
                loadPolls();
                loadExpenses();
            }
            
            loadGroupList();
            loadGroupPolls();
            
            closeLoginModal();
            alert('Вход выполнен! Добро пожаловать, ' + currentUser);
        } else {
            alert('Неверный логин или пароль');
        }
    };

    function closeLoginModal() {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
    }

    function logout() {
        currentUser = null;
        isAdmin = false;
        document.getElementById('authSection').innerHTML = '<button class="login-btn" id="showLoginBtn">🔐 Вход</button>';
        document.getElementById('groupTab').style.display = 'none';
        document.getElementById('adminTab').style.display = 'none';
        document.getElementById('showLoginBtn').onclick = () => {
            document.getElementById('loginModal').style.display = 'flex';
        };
        alert('Вы вышли из системы');
        document.querySelector('.nav-tab[data-page="news"]').click();
    }

    // Загрузка данных
    async function loadNews() {
        try {
            const snapshot = await db.collection('news').get();
            const container = document.getElementById('newsList');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-message">📭 Новостей пока нет</div>'; return; }
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="event-card">
                        <div class="event-title">${escapeHtml(data.title)}</div>
                        <div>${escapeHtml(data.text || data.description || '')}</div>
                    </div>
                `;
            });
        } catch(e) { console.error(e); }
    }

    async function loadEvents() {
        try {
            const snapshot = await db.collection('events').get();
            const container = document.getElementById('eventsList');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-message">🎉 Мероприятий пока нет</div>'; return; }
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="event-card">
                        <div class="event-title">${escapeHtml(data.title)}</div>
                        <div>${escapeHtml(data.place || '')}</div>
                    </div>
                `;
            });
        } catch(e) { console.error(e); }
    }

    async function loadVouchers() {
        try {
            const snapshot = await db.collection('vouchers').get();
            const container = document.getElementById('vouchersList');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-message">🏖️ Путевок пока нет</div>'; return; }
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="event-card">
                        <div class="event-title">${escapeHtml(data.title)}</div>
                        <div>${escapeHtml(data.place || '')}</div>
                    </div>
                `;
            });
        } catch(e) { console.error(e); }
    }

    async function loadGroupList() {
        const container = document.getElementById('groupList');
        let html = '';
        for (const login of Object.keys(USERS)) {
            html += `<div style="background:#f5f0e8; border-radius:12px; padding:10px;"><b>${login}</b></div>`;
        }
        container.innerHTML = html;
    }

    async function loadGroupPolls() {
        try {
            const snapshot = await db.collection('polls').get();
            const container = document.getElementById('groupPollsList');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-message">🗳️ Голосований пока нет</div>'; return; }
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="card" style="margin-bottom:15px">
                        <div class="card-title">${escapeHtml(data.question)}</div>
                    </div>
                `;
            });
        } catch(e) { console.error(e); }
    }

    async function loadPolls() {
        try {
            const snapshot = await db.collection('polls').get();
            const container = document.getElementById('pollsList');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-message">🗳️ Голосований пока нет</div>'; return; }
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="card" style="margin-bottom:15px">
                        <div class="card-title">${escapeHtml(data.question)}</div>
                    </div>
                `;
            });
        } catch(e) { console.error(e); }
    }

    async function loadExpenses() {
        try {
            const snapshot = await db.collection('expenses').get();
            const container = document.getElementById('expensesList');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-message">💰 Расходов пока нет</div>'; return; }
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `<div style="padding:8px; border-bottom:1px solid #eee;">${data.date} - ${data.category}: ${data.amount} ₽</div>`;
            });
        } catch(e) { console.error(e); }
    }

    // Админ-функции
    function openPollModal() {
        document.getElementById('modalTitle').innerHTML = '🗳️ Создать голосование';
        document.getElementById('modalBody').innerHTML = `
            <div class="form-group"><label>Вопрос</label><input type="text" id="pollQuestion"></div>
            <div class="form-group"><label>Варианты (через запятую)</label><input type="text" id="pollOptions" placeholder="Да, Нет"></div>
            <button class="admin-btn" onclick="savePoll()">Создать</button>
        `;
        document.getElementById('modal').style.display = 'flex';
    }

    async function savePoll() {
        const question = document.getElementById('pollQuestion')?.value;
        const options = document.getElementById('pollOptions')?.value;
        if (!question) return;
        await db.collection('polls').add({
            question: question,
            options: options ? options.split(',').map(s=>s.trim()) : [],
            timestamp: Date.now()
        });
        closeModal();
        loadPolls();
        loadGroupPolls();
    }

    function openExpenseModal() {
        document.getElementById('modalTitle').innerHTML = '💰 Добавить расход';
        document.getElementById('modalBody').innerHTML = `
            <div class="form-group"><label>Дата</label><input type="date" id="expenseDate"></div>
            <div class="form-group"><label>Статья</label><input type="text" id="expenseCategory"></div>
            <div class="form-group"><label>Сумма</label><input type="number" id="expenseAmount"></div>
            <button class="admin-btn" onclick="saveExpense()">Сохранить</button>
        `;
        document.getElementById('modal').style.display = 'flex';
    }

    async function saveExpense() {
        const date = document.getElementById('expenseDate')?.value;
        const category = document.getElementById('expenseCategory')?.value;
        const amount = document.getElementById('expenseAmount')?.value;
        if (!date || !category) return;
        await db.collection('expenses').add({ date, category, amount });
        closeModal();
        loadExpenses();
    }

    // Навигация
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`${tab.dataset.page}Page`).classList.add('active');
        });
    });

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closeModalOnClick(e) { if (e.target === document.getElementById('modal')) closeModal(); }
    function escapeHtml(text) { if (!text) return ''; return text.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    window.openPollModal = openPollModal;
    window.savePoll = savePoll;
    window.openExpenseModal = openExpenseModal;
    window.saveExpense = saveExpense;
    window.closeModal = closeModal;
    window.closeModalOnClick = closeModalOnClick;
    window.logout = logout;
    window.closeLoginModal = closeLoginModal;
</script>
</body>
</html>
